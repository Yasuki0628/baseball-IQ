<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7fb;--card:#fff;--ink:#12294a;--sub:#5a6b85;--line:#d5deeb;--blue:#2f6fdb;--red:#d6453d;--grn:#2e8b57;--amb:#c98a0b;--grass:#cfe8d3;--dirt:#e3c9a2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1829;--card:#15233a;--ink:#eaf0fa;--sub:#9fb0c9;--line:#2a3b58;--grass:#1f4a33;--dirt:#6b5636}}
:root[data-theme="dark"]{--bg:#0d1829;--card:#15233a;--ink:#eaf0fa;--sub:#9fb0c9;--line:#2a3b58;--grass:#1f4a33;--dirt:#6b5636}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:12px 0 2px;letter-spacing:.02em}
h2{font-size:18px;margin:18px 0 8px}
p{margin:6px 0}
.sub{color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center;font-weight:700;margin-top:14px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px}
.sit{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:12px;margin:8px 0}
svg{width:100%;height:auto;display:block;border-radius:10px;background:var(--grass)}
.ch{display:block;margin:8px 0}
.res{border-radius:10px;padding:12px;margin:10px 0;border:1.5px solid var(--line);background:var(--card)}
.g-best{border-color:var(--grn)}.g-alt,.g-cond{border-color:var(--amb)}.g-wrong,.g-danger{border-color:var(--red)}
.tag{font-weight:700;font-size:13px}
.t-best{color:var(--grn)}.t-alt,.t-cond{color:var(--amb)}.t-wrong,.t-danger{color:var(--red)}
.meter{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.row{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.note{font-size:13px;color:var(--sub);border-top:1px solid var(--line);margin-top:20px;padding-top:10px}
.hide{display:none}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-size:14px}.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:grid;grid-template-columns:104px 1fr 34px 40px;gap:6px;align-items:center;font-size:13px;margin:5px 0}
.row2 b{text-align:right}
.tm{border-collapse:collapse;font-size:13px;min-width:100%}.tm th,.tm td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}.tm th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.c1{background:rgba(214,69,61,.28)}.c2{background:rgba(201,138,11,.28)}.c3{background:rgba(46,139,87,.28)}.c0{color:var(--sub)}
.sc{overflow-x:auto}
textarea{width:100%;min-height:90px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:12px/1.4 monospace;word-break:break-all}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
</style>
</head>

const SK="bbiq2";
const HINT={投球:"牽制・クイック・球数管理の場面",捕手:"盗塁対応・ワンバウンド・声での指示",守備:"連携（カバー・中継・バックアップ）",打撃:"状況に合わせた打撃（進塁打・バント・追い込まれたとき）",走塁:"リード・スタート・コーチャーの確認",コーチ:"コーチャー・監督・ベンチの判断"};
function ld(){try{const o=JSON.parse(localStorage.getItem(SK+sfx())||"{}");return{pos:o.pos||{},skill:o.skill||{},miss:o.miss||{},hist:o.hist||[]}}catch(e){return{pos:{},skill:{},miss:{},hist:[]}}}
function sv(o){try{localStorage.setItem(SK+sfx(),JSON.stringify(o))}catch(e){}}
function record(q,g,raw){
  const d=ld(),v=Math.max(raw,0);
  const add=(m,k)=>{const x=m[k]||{n:0,s:0,b:0};x.n++;x.s+=v;if(g==="best")x.b++;m[k]=x};
  add(d.pos,q.group);add(d.skill,SKILL[q.group]);
  if(q.id){if(g==="wrong"||g==="danger")d.miss[q.id]=2;else if(g==="best"&&d.miss[q.id]){d.miss[q.id]--;if(d.miss[q.id]<=0)delete d.miss[q.id]}}
  sv(d);
}
function startMiss(){
  const d=ld();
  const list=Q.filter(q=>d.miss[q.id]).sort((a,b)=>d.miss[b.id]-d.miss[a.id]).slice(0,CFG.size);
  if(!list.length)return title("まちがえた問題はまだありません。");

const enc=o=>"BBIQ1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=t=>{try{return JSON.parse(decodeURIComponent(escape(atob(t.replace(/^BBIQ[A-Z0-9]+:/,"")))))}catch(e){return null}};
function clean(o){
  if(!o||o.v!==1||typeof o.name!=="string")return null;
  const name=o.name.replace(/[<>"&]/g,"").trim().slice(0,12);if(!name)return null;
  const num=x=>Number.isFinite(x)&&x>=0&&x<=1e6?Math.floor(x):0,sk=new Set(Object.values(SKILL));
  const cl=(m,ok)=>{const r={};Object.entries(m||{}).forEach(([k,x])=>{if(ok(k)&&x&&typeof x==="object")r[k]={n:num(x.n),s:num(x.s),b:num(x.b)}});return r};
  return{name,pos:cl(o.pos,k=>k in GROUPS&&k!=="all"),skill:cl(o.skill,k=>sk.has(k)),
    hist:(Array.isArray(o.hist)?o.hist:[]).slice(-20).map(h=>({d:String(h&&h.d||"").slice(0,12),m:String(h&&h.m||"").slice(0,16),sc:num(h&&h.sc),avg:num(h&&h.avg)}))};
}

    if(!rs.length){$("#rs2").innerHTML=`<p class="res g-wrong">読み込める回答コードがありません。</p>`;return}
    const sid=rs[0].sid,by={};
    rs.filter(o=>o.sid===sid).forEach(o=>{const name=o.name.replace(/[<>"&]/g,"").trim().slice(0,12);if(!name)return;
      by[name]=o.a.filter(x=>Array.isArray(x)&&Q.some(q=>q.id===x[0])&&PTS[x[1]]!==undefined).map(x=>[x[0],x[1]])});
    const names=Object.keys(by),ids=[...new Set(names.flatMap(n=>by[n].map(x=>x[0])))];
    const v=g=>Math.max(PTS[g],0);
    const qrows=ids.map(id=>{const q=Q.find(x=>x.id===id),a=names.map(n=>(by[n].find(x=>x[0]===id)||[])[1]).filter(Boolean);const avg=Math.round(a.reduce((s,g)=>s+v(g),0)/a.length);return{q,avg,n:a.length}});
    const sk={};qrows.forEach(r=>{const k=SKILL[r.q.group];(sk[k]=sk[k]||[]).push(r.avg)});
    const weak=[...qrows].sort((a,b)=>a.avg-b.avg).slice(0,3).filter(r=>r.avg<70);
    const per=names.map(n=>({n,avg:Math.round(by[n].reduce((s,x)=>s+v(x[1]),0)/Math.max(by[n].length,1)),c:by[n].length}));
    $("#rs2").innerHTML=`<h2>チーム結果（${names.length}人）</h2>
    ${rs.some(o=>o.sid!==sid)?`<p class="sub">別の出題の回答コードは除きました。</p>`:""}
    <h2>弱点の問題</h2>${weak.length?weak.map(r=>{const b=r.q.choices.find(c=>c.g==="best");return `<div class="res g-cond"><b>${esc2(r.q.role)}</b>：平均 ${r.avg}点（${r.n}人）<p>${esc2(r.q.situation)}</p><p class="sub">最適解：${esc2(b.t)}<br>${esc2(b.why)}</p></div>`}).join(""):`<p class="sub">平均70点を下回る問題はありません。</p>`}
    <h2>問題別</h2>${qrows.map(r=>`<div class="row2" style="grid-template-columns:1fr 60px 34px"><span>${esc2(r.q.role)}：${esc2(r.q.situation.slice(0,22))}…</span><div class="meter"><i style="width:${r.avg}%"></i></div><b>${r.avg}</b></div>`).join("")}
    <h2>分野別（チーム平均）</h2>${Object.entries(sk).map(([k,a])=>`<div class="row2" style="grid-template-columns:90px 1fr 34px"><span>${k}IQ</span><div class="meter"><i style="width:${Math.round(a.reduce((x,y)=>x+y,0)/a.length)}%"></i></div><b>${Math.round(a.reduce((x,y)=>x+y,0)/a.length)}</b></div>`).join("")}
    <h2>選手別（順位ではありません）</h2>${per.map(r=>`<p class="sub">${esc2(r.n)}：平均 ${r.avg}点（${r.c}問）</p>`).join("")}
    <p class="sub">点数は、最適解100・次善策60・条件付き40・不正解0です。個人の差より、チームの弱点の問題を見てください。</p>`;
  };
  $("#bk").onclick=title;
}

  return `<div class="bar"><span>${S.br?`分岐 ${S.i+1}手目`:`${S.i+1} / ${S.list.length}`}</span><span>スコア ${S.score}</span><span>連続正解 ${S.streak}</span></div>
  <div class="meter" style="margin:6px 0"><i style="width:${S.br?0:S.i/S.list.length*100}%"></i></div>
  <div class="chips"><span class="chip">${q.inning}回</span><span class="chip">${q.outs}アウト</span><span class="chip">${q.count}</span><span class="chip">${sc}</span><span class="chip">${q.role}の視点</span>${S.group!=="all"&&!q.chain&&q.group!==S.group?`<span class="chip">関連ポジション</span>`:""}${q.chain?`<span class="chip">チェーン「${q.chain}」${q.step}/${q.n}</span>`:""}<span class="chip">難易度 Lv.${q.diff}</span>${S.br?`<span class="chip">分岐「${S.br.title}」</span>`:""}${S.team?`<span class="chip">チーム対抗「${S.team.t}」</span>`:""}${S.sc?`<span class="chip">同一シーン「${S.sc.title}」</span>`:""}${S.share?`<span class="chip">分担：${S.share.name}</span>`:""}</div>`;
}
function question(){
  if(S.i>=S.list.length)return result();
  const q=S.list[S.i];
  // 選択肢の並び順を毎回入れ替える（位置で答えを覚えさせない）
  const order=q.choices.map((c,i)=>i).sort(()=>Math.random()-.5);
  S.order=order;
  app.innerHTML=head(q)+field(q)+`<div class="sit">${q.situation}</div>`+
   order.map(i=>`<button class="btn ch" data-i="${i}">${q.choices[i].t}</button>`).join("");
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  const q=S.list[S.i],c=q.choices[i];
  const base=PTS[c.g],mult=1+(q.diff-1)*0.1;
  let gain=Math.round(base*mult);
  if(c.g==="best"){S.streak++;if(S.streak>=3)gain+=10}else S.streak=0;
  let bonus=0;S.log.push({q,g:c.g,raw:base});record(q,c.g,base);
  if(q.chain&&q.step===q.n){const last=S.log.slice(-q.n);if(last.every(l=>l.g==="best"||l.g==="alt")){bonus=50;gain+=50}}
  S.score+=gain;
  const items=S.order.map(k=>{const x=q.choices[k];return `<div class="res g-${x.g}"><div class="tag t-${x.g}">${NAME[x.g]}${k===i?"（あなたの選択）":""}</div><div>${x.t}</div><p class="sub">${x.why}</p>${x.res?`<p class="sub">→ ${x.res}</p>`:""}</div>`}).join("");
  app.innerHTML=head(q)+`<div class="sit"><b>${NAME[c.g]}：${gain>=0?"+":""}${gain}点</b>${S.streak>=3&&c.g==="best"?"（連続ボーナス+10）":""}${bonus?"（チェーン成功ボーナス+50）":""}${c.res?`<br>プレーの結果：${c.res}`:""}</div>
  <h2>それぞれの判断の理由</h2>${items}
  <button class="btn pri" id="nx">${(S.br?(!c.next||c.next==="end"):S.i+1>=S.list.length)?"結果を見る":"次の場面へ"}</button>`;
  $("#nx").onclick=()=>{
    if(S.br){if(!c.next||c.next==="end"){S.i=S.list.length}else{S.list.push(S.br.scenes[c.next]);S.i++}}else S.i++;
    window.scrollTo(0,0);question()};
  window.scrollTo(0,0);
}
function result(){
  const by={};
  S.log.forEach(({q,raw})=>{const k=SKILL[q.group];(by[k]=by[k]||[]).push(Math.max(raw,0))});
  const avg=Math.round(S.log.reduce((a,l)=>a+Math.max(l.raw,0),0)/S.log.length);
  const rank=avg>=90?"S":avg>=75?"A":avg>=60?"B":avg>=40?"C":"D";
  const d=load();save({best:Math.max(d.best||0,S.score),avg});{const h=ld();h.hist.push({d:new Date().toLocaleDateString("ja-JP"),m:S.br?S.br.title:(S.miss?"苦手克服":GROUPS[S.group]),sc:S.score,avg});h.hist=h.hist.slice(-20);sv(h)}
  const rows=Object.entries(by).map(([k,v])=>{const a=Math.round(v.reduce((x,y)=>x+y,0)/v.length);return `<div class="row"><span>${k}IQ</span><div class="meter"><i style="width:${a}%"></i></div><b>${a}</b></div>`}).join("");
  const weak=Object.entries(by).map(([k,v])=>[k,v.reduce((x,y)=>x+y,0)/v.length]).sort((a,b)=>a[1]-b[1])[0];
  app.innerHTML=`<p class="sub">結果</p><h1>ランク ${rank}</h1><p>合計 ${S.score}点 ／ 平均判断 ${avg}点</p>
  ${S.br?`<h2>あなたの道筋</h2>`+S.log.map(l=>`<p class="sub">${l.q.role}：${NAME[l.g]}</p>`).join(""):""}<h2>分野別のIQ</h2>${rows}
  <p class="sub">いちばん伸ばせるのは「${weak[0]}」です。まちがえた場面を、チームで「なぜ？」と話してみましょう。</p>
  <button class="btn pri" id="again">もう一度</button><button class="btn pri" id="home" style="margin-top:8px">ポジション選択へ</button>
  ${S.sc?cmpBox():""}${S.share?shareBox():""}${S.team?teamBox():""}<p class="note">点数は「早さ」ではなく「判断の正確さ」だけで決まります。</p>`;
  $("#again").onclick=()=>S.br?startBr(S.br.id):S.team?startTeam(S.team):S.sc?startScene(S.sc.id):S.share?startShare({sc:SCN.find(c=>c.id===S.share.sc),sid:S.share.sid},S.share.ri,S.share.name):start(S.group);$("#home").onclick=title;if(S.team)teamBind();if(S.share)shareBind();
}
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}

title();
</script>
